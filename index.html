<title>Neon Waypoint | GTA 6 Fixes. Tested. Exact. Fast.</title>

<style>
  :root {
    --navy: #0B1026;
    --navy-2: #141B3D;
    --pink: #FA227C;
    --cyan: #2EC5FF;
    --ink: #F4F6FF;
    --muted: #A9B3D6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 110%, rgba(46,197,255,.14), transparent 60%),
      linear-gradient(180deg, #070a1a 0%, #0B1026 55%, #1a0c2e 100%),
      var(--navy);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .skyline {
    position: fixed; left: 0; right: 0; bottom: 0; height: min(62vh, 520px);
    pointer-events: none; z-index: 0; opacity: .85;
  }
  .skyline-svg { width: 100%; height: 100%; display: block; }
  .skyline::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(7,10,26,.55) 0%, rgba(7,10,26,0) 60%), linear-gradient(to top, rgba(7,10,26,0) 40%, rgba(7,10,26,.6) 100%);
  }
  main, footer { position: relative; z-index: 1; }
  main {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 64px 24px;
    gap: 28px;
  }
  .logo { width: min(180px, 40vw); height: auto; filter: drop-shadow(0 0 24px rgba(250,34,124,.45)); }
  .wordmark {
    font-family: "Mr Dafoe", "Brush Script MT", cursive;
    font-size: clamp(56px, 11vw, 120px);
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,.35), 0 0 16px var(--pink), 0 0 40px rgba(250,34,124,.55);
    position: relative;
  }
  .wordmark::after {
    content: "";
    display: block;
    width: 100%; height: 3px; margin-top: 24px;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan), 0 0 26px rgba(46,197,255,.35);
    border-radius: 2px;
  }
  .promise {
    font-size: clamp(18px, 2.4vw, 22px);
    color: var(--muted);
    max-width: 560px;
  }
  .promise strong { color: var(--ink); font-weight: 700; letter-spacing: .04em; }
  .cta {
    display: inline-block;
    background: linear-gradient(135deg, #FA227C 0%, #c8197a 100%);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
    padding: 16px 34px;
    border-radius: 999px;
    box-shadow: 0 0 0 2px rgba(250,34,124,.35), 0 10px 30px rgba(250,34,124,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover, .cta:focus-visible { transform: translateY(-2px); box-shadow: 0 0 0 3px rgba(250,34,124,.5), 0 14px 36px rgba(250,34,124,.45); outline: none; }
  .socials {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
    list-style: none;
  }
  .socials a {
    display: inline-block;
    color: var(--ink);
    text-decoration: none;
    border: 1.5px solid var(--cyan);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 15px;
    transition: background .15s ease, color .15s ease;
  }
  .socials a:hover, .socials a:focus-visible { background: var(--cyan); color: var(--navy); outline: none; }
  footer {
    text-align: center;
    background: linear-gradient(to top, rgba(7,10,26,.85), rgba(7,10,26,0));
    padding: 24px;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid rgba(46,197,255,.18);
  }
  footer p + p { margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
